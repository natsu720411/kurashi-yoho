name: Kurashi Yoho free Google API weekly SEO audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/kurashi-yohou/scripts/weekly_seo_audit.py'
      - 'artifacts/kurashi-yohou/scripts/tests/test_weekly_seo_audit.py'
      - '.github/workflows/kurashi-yoho-free-seo-audit.yml'
  schedule:
    - cron: '17 23 * * 0'
permissions:
  contents: read
concurrency:
  group: kurashi-free-seo-audit
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify analysis logic
        run: python -m unittest discover -s artifacts/kurashi-yohou/scripts/tests -v
      - name: Check Google setup
        id: config
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Google API認証の設定待ち" >> "$GITHUB_STEP_SUMMARY"
            echo "Secret GOOGLE_SERVICE_ACCOUNT_JSON が未設定です。まだデータを取得していません。" >> "$GITHUB_STEP_SUMMARY"
            echo "手順: artifacts/kurashi-yohou/docs/GOOGLE_FREE_ANALYTICS_SETUP.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install official Google authentication
        if: steps.config.outputs.configured == 'true'
        run: python -m pip install 'google-auth>=2,<3' 'requests>=2.31,<3'
      - name: Read Google Search Console and GA4
        if: steps.config.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GSC_SITE_URL: https://kurashi-yoho.vercel.app/
          REPORT_PATH: seo-report.md
        run: python artifacts/kurashi-yohou/scripts/weekly_seo_audit.py
      - name: Save the Japanese report
        if: steps.config.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kurashi-seo-weekly-report
          path: seo-report.md
          retention-days: 14
          if-no-files-found: error
