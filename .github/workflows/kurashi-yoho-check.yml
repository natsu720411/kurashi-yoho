name: Kurashi Yoho checks
on:
  push:
    branches: [main]
    paths:
      - 'artifacts/kurashi-yohou/**'
      - '.github/workflows/kurashi-yoho-check.yml'
  pull_request:
    paths:
      - 'artifacts/kurashi-yohou/**'
      - '.github/workflows/kurashi-yoho-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s artifacts/kurashi-yohou/scripts/tests -v
      - run: node --test artifacts/kurashi-yohou/tests/*.test.mjs
      - run: pnpm --filter @workspace/kurashi-yohou typecheck
      - run: pnpm --filter @workspace/kurashi-yohou build
